<!-- =================================== login.component.html ================================== -->
<!-- Esta es la página a la que accederá todo el mundo. Es una única página de login, no  
 hay una para usuarios y otra para administradores, sino solo esta                    
 Cuando la persona haga login, tenemos dos opciones:
 - OPCIÓN 1: Que al hacer login reconozca si es un usuario normal o un administrador. 
             Al usuario lo redirigirá a la página inicio.html y al administrador lo   
             redirigirá a la página dashboard.html                                    
 - OPCIÓN 2: Que al hacer login reconozca si es un usuario normal o un administrador.
             Dado que el administrador también puede ser un usuario que haga tareas,  
             redirigirá a todo el mundo a la página inicio.html                       
             Pero los administradores tendrán un botón de "Ir a modo administrador"   
             con el que podrá entrar a dashboard.html                                 
             Los usuarios normales no podrán ver este botón, sólo los administradores. 
            Eso puede hacerse con javascript                                                     -->
<!-- =========================================================================================== -->

<div class="fondo-login">

    <!-- Tarjeta principal del login -->
    <div class="tarjeta-login">

        <!-- Logo y título -->
        <div class="marca-login">
            <img
                src="/logo/logo_ZereginApp.png"
                alt="Logo de ZereginApp"
            >

            <h1>
                ZereginApp
            </h1>

            <p class="texto-responsivo-pequeno">
                Fiestas de la Blanca 2026 - Vitoria-Gasteiz
            </p>
        </div>

        <!-- Descripción de la aplicación -->
        <div class="aviso-sin-borde aviso-azul items-center">

            <svg xmlns="http://www.w3.org/2000/svg"
                class="icono-extragrande icono-azul-sin-fondo"
                viewBox="-20 0 50 24">

                <path d="M0 0h24v24H0z" fill="none" />

                <g fill="none">
                    <rect width="18.01" height="5.26" x="2.98" y="3.43" fill="currentColor" opacity=".2" rx="1" />
                    <path stroke="blue" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="m14.38 19.17l.97 1.2c.72.87 1.08 1.31 1.56 1.31c.47 0 .83-.44 1.55-1.32l3.8-4.69m-1.27-3.57V9.42c0-2.83 0-4.24-.88-5.12s-2.3-.88-5.12-.88H8.98c-2.83 0-4.24 0-5.12.88s-.88 2.3-.88 5.12v6.01c0 2.83 0 4.25.88 5.12s2.29.88 5.12.88h2.98M7.67 1.73v3.4m8.69-3.4v3.4m4.21 3.57H3.8" />
                </g>
            </svg>

            <p class="texto-responsivo-pequeno text-gris-oscuro">
                Gestión interna de tareas y turnos de la cuadrilla
            </p>
        </div>

        <!-- Formulario de acceso -->
        <form (submit)="iniciarSesion($event)">

            <div class="campo-escrito-label">

                <!-- Correo electrónico -->
                <label for="email" >
                    Correo electrónico
                </label>

                <div class="campo-escrito w-full">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        required
                        placeholder="ejemplo@correo.com"
                    >
                </div>
            </div>

            <div class="campo-escrito-label">

                <!-- Contraseña -->
                <label for="password">
                    Contraseña
                </label>

                <div class="campo-escrito w-full">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect x="3" y="10" width="18" height="12" rx="2"/>
                        <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
                    </svg>

                    <input
                        id="password"
                        name="password"
                        [type]="mostrarContrasena ? 'text' : 'password'"
                        autocomplete="current-password"
                        required
                        placeholder="Introduce tu contraseña"
                    >

                    <!-- Botón para mostrar/ocultar contraseña -->
                    <button
                        type="button"
                        (click)="alternarContrasena()"
                        [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                        
                    >
                        <svg xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7"/>
                            <circle cx="12" cy="12" r="3"/>

                            <!-- Línea que aparece cuando la contraseña está oculta -->
                            <path
                                d="M3 3l18 18"
                                [attr.opacity]="mostrarContrasena ? 0 : 1"
                            />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mantener sesión activa -->
            <div class="campo-check">

                <input
                    type="checkbox"
                    name="mantenerSesion"
                >
                <label>Mantener sesión activa</label>

            </div>

            <!-- LÓGICA ANGULAR: Botón de inicio de sesión. Revisa y valida usuario y contraseña, y permite o deniega el acceso. 
                 También controla si la persona ha marcado la casilla de Mantener sesión activa para que no vuelva a pedir el login-->
            <button
                type="submit"
                class="boton-base-sin-icono boton-azul-intenso font-bold"
            >
                Iniciar sesión
            </button>

        </form>

        <!-- LÓGICA ANGULAR: Mensaje de error: Muestra el mensaje si el login ha sido incorrecto -->
        <div class="aviso-sin-borde aviso-rojo hidden">
            <svg xmlns="http://www.w3.org/2000/svg" 
                class="icono-pequeno" 
                viewBox="0 0 16 16"
            >
                <path d="M0 0h16v16H0z" fill="none" />
                <path fill="currentColor" fill-rule="evenodd" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m3.707 3.293a1 1 0 0 0-1.414 0L8 6.586L5.707 4.293a1 1 0 1 0-1.414 1.414L6.586 8l-2.293 2.293a1 1 0 1 0 1.414 1.414L8 9.414l2.293 2.293a1 1 0 1 0 1.414-1.414L9.414 8l2.293-2.293a1 1 0 0 0 0-1.414" clip-rule="evenodd" />
            </svg>
            <span>La dirección de correo electrónico o la contraseña no son correctos</span>
        </div>

        <!-- Recuperación de contraseña -->
        <button
            type="button"
            (click)="mostrarOlvidoContrasenaModal = true"
            class="enlace self-center my-2"
        >
            ¿Has olvidado tu contraseña?
        </button>

        <!-- Aviso de acceso restringido -->
        <div class="aviso-sin-borde aviso-gris">

            <svg xmlns="http://www.w3.org/2000/svg"
                class="icono-mediano icono-azul-sin-fondo"
                viewBox="0 0 24 24"
                fill="currentColor">

                <path fill-rule="evenodd"
                    d="M12 2a2 2 0 0 1 .7.12l7 2.5a2 2 0 0 1 1.3 1.9c0 7.1-3.5 12.1-8.1 15a1.7 1.7 0 0 1-1.8 0C6.5 18.6 3 13.6 3 6.5a2 2 0 0 1 1.3-1.9l7-2.5A2 2 0 0 1 12 2Zm3.7 7.8a1 1 0 0 0-1.4-1.4l-3.5 3.5-1.1-1.1a1 1 0 0 0-1.4 1.4l1.8 1.8a1 1 0 0 0 1.4 0l4.2-4.2Z"
                    clip-rule="evenodd"/>
            </svg>

            <p class="texto-responsivo-pequeno ">
                Acceso exclusivo para miembros censados de
                <strong class="text-gris-oscuro">ZereginApp</strong>.
                No se permite registro público.
            </p>
        </div>

    </div>

    <!-- Ventana modal para invitar a una persona participante -->
    <app-olvido-contrasena-modal
        *ngIf="mostrarOlvidoContrasenaModal"
        (cerrarOlvidoContrasena)="mostrarOlvidoContrasenaModal = false">
    </app-olvido-contrasena-modal>

</div>
